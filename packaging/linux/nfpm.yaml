# nfpm package descriptor for Omalogi Linux packages (.deb / .rpm / .pkg.tar.zst).
#
# Build with the xtask:
#   cargo run -p xtask -- linux package
#
# Or directly (requires nfpm in PATH; set VERSION and PKG_ARCH):
#   VERSION=0.6.0 PKG_ARCH=amd64 nfpm package --packager deb --target target/release
#   VERSION=0.6.0 PKG_ARCH=arm64 nfpm package --packager rpm --target target/release
#   VERSION=0.6.0 PKG_ARCH=amd64 nfpm package --packager archlinux --target target/release

name: omalogi
version: "${VERSION}"
arch: "${PKG_ARCH}"
maintainer: Kurt Lieber <kurt@lieber.org>
description: |-
  Logitech HID++ device control for Omarchy — remap buttons, DPI, and
  SmartShift, with Hyprland-native system actions. A fork of OpenLogi.
  No account, no telemetry; configuration lives in a plain TOML file.
homepage: https://github.com/kurtlieber/omalogi
license: Apache-2.0 OR MIT
# Only one HID++ manager can own a receiver at a time, so Omalogi cannot be
# installed beside upstream OpenLogi or Solaar, whose udev rules and
# autostart would compete for the same devices. `openlogi` also covers
# Omalogi's own packages from before the rename (ADR-0006).
conflicts:
  - openlogi
  - openlogi-bin
  - openlogi-git
  - solaar

contents:
  # ── binaries ────────────────────────────────────────────────────────────────
  - src: target/release/omalogi
    dst: /usr/bin/omalogi
    file_info:
      mode: 0755

  - src: target/release/omalogi-desktop
    dst: /usr/bin/omalogi-desktop
    file_info:
      mode: 0755

  - src: target/release/omalogi-overlay
    dst: /usr/bin/omalogi-overlay
    file_info:
      mode: 0755

  - src: target/release/omalogi-agent
    dst: /usr/bin/omalogi-agent
    file_info:
      mode: 0755

  # ── udev rules ──────────────────────────────────────────────────────────────
  - src: packaging/linux/udev/70-omalogi.rules
    dst: /etc/udev/rules.d/70-omalogi.rules
    file_info:
      mode: 0644

  # ── systemd user unit ───────────────────────────────────────────────────────
  - src: packaging/linux/systemd/omalogi-agent.service
    dst: /usr/lib/systemd/user/omalogi-agent.service
    file_info:
      mode: 0644

  # ── XDG desktop entry ───────────────────────────────────────────────────────
  - src: packaging/linux/desktop/omalogi.desktop
    dst: /usr/share/applications/omalogi.desktop
    file_info:
      mode: 0644

  # ── icon ────────────────────────────────────────────────────────────────────
  # Every standard indexed hicolor size, not just the 1024 master: a stock
  # `hicolor/index.theme` stops at 512x512, so a launcher that resolves icons
  # by theme index (KDE's kbuildsycoca, most GTK launchers) finds nothing at
  # all when only `1024x1024/apps` is installed.
  - src: assets/icon/omalogi.png
    dst: /usr/share/icons/hicolor/1024x1024/apps/omalogi.png
    file_info:
      mode: 0644
  - src: assets/icon/omalogi-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/omalogi.png
    file_info:
      mode: 0644
  - src: assets/icon/omalogi-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/omalogi.png
    file_info:
      mode: 0644
  - src: assets/icon/omalogi-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/omalogi.png
    file_info:
      mode: 0644
  - src: assets/icon/omalogi-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/omalogi.png
    file_info:
      mode: 0644
  - src: assets/icon/omalogi-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/omalogi.png
    file_info:
      mode: 0644
  - src: assets/icon/omalogi-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/omalogi.png
    file_info:
      mode: 0644
  - src: assets/icon/omalogi-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/omalogi.png
    file_info:
      mode: 0644

  - src: LICENSE-APACHE
    dst: /usr/share/licenses/omalogi/LICENSE-APACHE
    file_info:
      mode: 0644

  - src: LICENSE-MIT
    dst: /usr/share/licenses/omalogi/LICENSE-MIT
    file_info:
      mode: 0644

archlinux:
  packager: "Kurt Lieber <kurt@lieber.org>"

overrides:
  deb:
    depends:
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb1
  archlinux:
    depends:
      - dbus
      - fontconfig
      - gcc-libs
      - glibc
      - libglvnd
      - libxcb
      - libxkbcommon
      - libxkbcommon-x11
      - vulkan-icd-loader
      - wayland

scripts:
  postinstall: packaging/linux/nfpm-scripts/postinstall.sh
  postremove: packaging/linux/nfpm-scripts/postremove.sh
