name: ✨ Feature Request
description: Suggest a new feature or an improvement to existing functionality.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Great. Requests for a **specific Logitech device** belong
        upstream at [OpenLogi](https://github.com/AprilNEA/OpenLogi/issues) —
        Omalogi pulls device support from there.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched existing issues and this isn't already tracked.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do? What's missing or frustrating today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Omalogi to do on Omarchy?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
