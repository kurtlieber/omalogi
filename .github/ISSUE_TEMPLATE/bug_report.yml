name: 🐞 Bug Report
description: Something is broken or behaves incorrectly on Omarchy.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Omalogi talks to hardware over HID++ and
        dispatches system actions through Hyprland/Omarchy, so **device,
        connection, and version details are essential**.

        GUI users: open the **About** window and click **Copy Diagnostics** — it
        captures most of what's asked below in one privacy-filtered paste.

        A bug in device detection or a HID++ feature that also reproduces with
        upstream [OpenLogi](https://github.com/AprilNEA/OpenLogi) belongs there.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched [existing issues](https://github.com/kurtlieber/omalogi/issues?q=is%3Aissue) and this is not a duplicate.
          required: true
        - label: I am on a recent `master` build.
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Which part of Omalogi?
      options:
        - GUI (desktop app)
        - Agent (button remapping / gestures / system actions)
        - CLI (the `openlogi` binary)
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Omalogi version or commit
      description: GUI → About window, `openlogi --version`, or `git rev-parse --short HEAD`.
    validations:
      required: true

  - type: input
    id: omarchy
    attributes:
      label: Omarchy and Hyprland versions
      description: "`omarchy version` and `hyprctl version | head -1`."
      placeholder: e.g. Omarchy 4.0, Hyprland 0.56.2
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: e.g. MX Master 3S, M720 Triathlon
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: How is the device connected?
      options:
        - Logi Bolt receiver
        - Unifying receiver
        - Bluetooth
        - USB cable
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: Paste the output of **About → Copy Diagnostics**.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl --user -u openlogi-agent -b` around the failure, or run with `OPENLOGI_LOG=debug`."
      render: text
