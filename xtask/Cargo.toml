[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Omalogi repository maintenance tasks."
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
comfy-table = { version = "8.0.0", default-features = false }
fs-err = "3.3.0"
# For `brand`: the executable names the Linux packages install. The app reads
# the same constants at runtime, so packaging and the app cannot diverge.
openlogi-core = { version = "0.8.9", path = "../crates/openlogi-core" }
path-absolutize = "3.1.1"
serde = { workspace = true }
serde_json = { workspace = true }
strum = { version = "0.27", features = ["derive"] }
toml.workspace = true
which = "8.0.4"
xshell = "0.2.7"

[lints]
workspace = true
