[package]
name = "openlogi-overlay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OpenLogi Actions Ring overlay — the cursor-centred radial menu, a pure IPC client of the agent."
# Distributed as a login-item helper inside the bundled .app; never published.
publish = false

[[bin]]
name = "openlogi-overlay"
path = "src/main.rs"

[dependencies]
openlogi-core = { path = "../openlogi-core", features = ["logging", "worker"] }
openlogi-hook = { path = "../openlogi-hook" }
openlogi-ipc = { path = "../openlogi-ipc" }
openlogi-ui = { path = "../openlogi-ui" }
anyhow = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
rust-i18n = "4"
succession = "0.2"
tarpc = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
