[package]
name = "openlogi-camera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Generic Logitech UVC webcam discovery for OpenLogi (V4L2 on Linux)."
keywords = ["logitech", "uvc", "webcam", "camera", "v4l2"]
categories = ["hardware-support"]

[dependencies]
openlogi-device-registry = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# `zune-jpeg` decodes MJPEG straight to BGRA — gpui's texture order, so the
# preview needs no swap — and already ships in the tree via `image`.
[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"
zune-jpeg = "0.5"
zune-core = "0.5"

[lints]
workspace = true
