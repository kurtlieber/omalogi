[package]
name = "openlogi-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OpenLogi background agent — headless, always-on owner of the input hook, HID++ device I/O, and (later) the menu-bar tray."
# Distributed as a login-item helper inside the bundled .app; never published.
publish = false

[[bin]]
name = "openlogi-agent"
path = "src/main.rs"

# Hardware-free mock agent for GUI development: serves a scripted inventory over
# the real IPC socket. Dev-only — xtask bundles `openlogi-agent` by exact path,
# so this binary never ships.
[[bin]]
name = "openlogi-agent-mock"
path = "src/bin/mock_agent.rs"

[dependencies]
openlogi-agent-core = { path = "../openlogi-agent-core" }
openlogi-core = { path = "../openlogi-core", features = ["logging", "worker"] }
openlogi-device = { path = "../openlogi-device" }
openlogi-fixture = { workspace = true }
openlogi-hid = { path = "../openlogi-hid" }
openlogi-hook = { path = "../openlogi-hook" }
openlogi-inject = { path = "../openlogi-inject" }
openlogi-ipc = { path = "../openlogi-ipc" }
serde_json.workspace = true
tarpc = { workspace = true }
interprocess = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "signal"] }
futures = "0.3"
rust-i18n = "4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
opener = { workspace = true }
succession = { version = "0.2", features = ["supervision", "eviction"] }
tracing-appender = "0.2.5"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
