[package]
name = "openlogi-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GPUI-based desktop UI for OpenLogi."
default-run = "openlogi-desktop"
# Distributed as a bundled app; Kit stays Git-pinned to embed its full themes.
publish = false

[[bin]]
name = "openlogi-desktop"
path = "src/main.rs"

[dependencies]
appcatalog = "0.1.1"
openlogi-core = { path = "../openlogi-core", features = ["logging", "worker"] }
openlogi-ui = { path = "../openlogi-ui" }
openlogi-camera = { path = "../openlogi-camera" }
openlogi-hook = { path = "../openlogi-hook" }
openlogi-assets = { path = "../openlogi-assets" }
openlogi-ipc = { path = "../openlogi-ipc" }
openlogi-permissions = { path = "../openlogi-permissions" }
tarpc = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
gpui-base = { workspace = true }
gpui-kit-assets = { workspace = true }
swr-core = { workspace = true }
swr-gpui = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process"] }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
rust-i18n = "4"
# The raw, un-negotiated system locale for the diagnostics report; locale
# *negotiation* lives in openlogi-ui.
sys-locale = "0.3.2"
gpui-updater = { package = "gpui-updater-pre", version = "0.1" }
# Spawns the agent under its own macOS TCC identity (see ipc_client::spawn_agent).
disclaim = "0.1"
url = "2.5.8"
walkdir = "2.5.0"
opener = { workspace = true }
derive_more = { version = "2.1.1", default-features = false, features = ["display", "from"] }

[build-dependencies]
serde_json.workspace = true

# Window chrome, host OS string, and installed-app icon lookup only — the
# menu-bar status item lives in the agent, not here.
[lints]
workspace = true

[dev-dependencies]
openlogi-ipc = { path = "../openlogi-ipc", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
openlogi-device = { path = "../openlogi-device" }
openlogi-fixture = { workspace = true }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
